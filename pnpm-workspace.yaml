packages:
  - attw-fork
  - drizzle-orm
  - drizzle-kit
  - drizzle-seed
  - integration-tests
  - postgres
  - typeperf-test
  - eslint-plugin-drizzle
  - test-utils

# pnpm runs dependency build scripts only for packages listed here: true runs them, false skips them
# without warning. A dependency with a build script missing from this list fails the install.
allowBuilds:
  '@contrast/fn-inspect': true
  '@newrelic/native-metrics': true
  aws-sdk: false
  better-sqlite3: true
  bufferutil: true
  cpu-features: true
  dprint: true
  duckdb: true
  es5-ext: true
  esbuild: true
  msgpackr-extract: true
  prisma: false
  '@prisma/client': false
  '@prisma/engines': false
  protobufjs: true
  sharp: false
  sqlite3: true
  ssh2: true
  utf-8-validate: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    # tsconfck (via vite-tsconfig-paths) still declares typescript ^5; it only reads tsconfig files
    tsconfck>typescript: '6'
