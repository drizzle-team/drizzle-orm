# This filename must be registered on npmjs.com as the trusted publisher for @drizzle-team/postgres.
# Renaming it requires updating the npmjs.com record the same day, or publishes fail
# with E404. `npm publish` must stay in this file: in a reusable workflow, npm checks
# the caller's filename.
name: postgres publish

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: postgres-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: postgres

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fail if version already published
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG@$VERSION is already on npm. Bump the version in postgres/package.json."
            exit 1
          fi

  gates:
    uses: ./.github/workflows/postgres-ci.yml

  publish:
    needs: [preflight, gates]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      - run: npm publish
