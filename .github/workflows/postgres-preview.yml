# Checks every Drizzle Postgres commit. A push publishes a preview build to pkg.pr.new.
# Requires the pkg.pr.new GitHub App on this repository: https://github.com/apps/pkg-pr-new
name: postgres preview release

on:
  push:
    branches: ['**']
    tags: ['!**']
    paths:
      - 'postgres/**'
      - '.github/workflows/postgres-preview.yml'
      - '.github/ci/publish-preview.sh'
  pull_request:
    paths:
      - 'postgres/**'
      - '.github/workflows/postgres-preview.yml'
      - '.github/ci/publish-preview.sh'

# The token only checks out the code. The pkg.pr.new app posts the PR comment.
permissions:
  contents: read

concurrency:
  group: postgres-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: postgres

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # pkg-pr-new runs under node and shells out to `npm pack`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres

      # The unit gate of postgres-ci.yml; the integration suite needs a live cluster and is too slow here.
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/unit
      - run: bun run verify:publish

      # On a pull request, the feature-branch pipeline publishes this package together with the other packages, so
      # the pull request gets one pkg.pr.new comment. A push to a branch without a pull request publishes it here.
      # continue-on-error: a pkg.pr.new outage must not fail a commit the gates above passed.
      - name: Publish preview to pkg.pr.new
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: .
        run: bash .github/ci/publish-preview.sh off postgres
