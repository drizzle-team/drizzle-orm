name: Release (feature branch)

on:
  workflow_call:
    inputs:
      publish_to_github:
        description: 'Publish to GitHub Packages instead of npm'
        type: boolean
        default: false
      packages:
        description: 'Comma-separated list of packages to publish, or "all"'
        type: string
        default: 'all'
      runner:
        # The router picks the self-hosted machine when it is online (see router.yaml), GitHub-hosted otherwise.
        description: 'runs-on for every job but release, as JSON: "ubuntu-24.04" or a list of self-hosted labels'
        type: string
        default: '"ubuntu-24.04"'
    secrets:
      PLANETSCALE_CONNECTION_STRING:
        required: true
      NEON_CONNECTION_STRING:
        required: true
      NEON_HTTP_CONNECTION_STRING:
        required: true
      TIDB_CONNECTION_STRING:
        required: true
      XATA_API_KEY:
        required: true
      XATA_BRANCH:
        required: true
      LIBSQL_REMOTE_URL:
        required: true
      LIBSQL_REMOTE_TOKEN:
        required: true
      TURSODATABASE_REMOTE_URL:
        required: true
      TURSODATABASE_REMOTE_TOKEN:
        required: true
      TURBO_TOKEN:
        required: true
      NETLIFY_DB_URL:
        required: true
      GH_PACKAGES_TOKEN:
        required: false
      PLANETSCALE_ORG:
        required: false
      PLANETSCALE_SERVICE_TOKEN_ID:
        required: false
      PLANETSCALE_SERVICE_TOKEN:
        required: false
      TURSO_ORG:
        required: false
      TURSO_API_TOKEN:
        required: false
      TURSO_GROUP:
        required: false

concurrency:
  group: feature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 25
    outputs:
      publish_matrix: ${{ steps.publish-matrix.outputs.packages }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: 'team_KbvYUtAn1Tqytsj8HbNcYDqV'
    steps:
      - name: Compute publish matrix
        id: publish-matrix
        shell: bash
        env:
          PACKAGES_FILTER: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          all='["drizzle-orm","drizzle-kit","drizzle-seed","eslint-plugin-drizzle"]'
          if [[ -z "$PACKAGES_FILTER" || "$PACKAGES_FILTER" == "all" ]]; then
            selected="$all"
          else
            selected="$(jq -cn --arg f "$PACKAGES_FILTER" '$f | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')"
            unknown="$(jq -cn --argjson all "$all" --argjson sel "$selected" '$sel - $all')"
            if [[ "$unknown" != "[]" ]]; then
              echo "::error::Unknown package(s) in filter: $unknown"
              exit 1
            fi
            if [[ "$selected" == "[]" ]]; then
              echo "::error::Empty package filter"
              exit 1
            fi
          fi
          echo "packages=$selected" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/checkout@v7
        # Self-hosted: keep node_modules between jobs; setup-pnpm removes everything else untracked.
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Compute version suffix
        id: meta
        shell: bash
        run: echo "suffix=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build all
        run: pnpm build:artifact
      - name: Share build-dist
        uses: ./.github/actions/share-build
      - name: Pack
        run: pnpm pack:artifact
      - uses: actions/upload-artifact@v7
        with: 
          name: packages
          path: |
            drizzle-orm/package.tgz
            drizzle-kit/package.tgz
            drizzle-seed/package.tgz
            eslint-plugin-drizzle/package.tgz

      - name: test:types & lint
        run: pnpm test:types-lint

  prepare-head-start:
    # The jobs below start beside prepare rather than after it: they install, start their databases and then
    # wait for prepare's artifacts, so that setup overlaps the build. The organization runs at most 20 jobs at
    # once, and they are more than that; queued after this short delay, they never take the runner prepare needs.
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 2
    steps:
      - run: sleep 10

  test:
    needs: [prepare-head-start]
    permissions: { contents: read, actions: read }
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: int:mysql
            dbs: [mysql]
          - shard: int:postgres
            dbs: [postgres, postgres-http-gateway, aws-data-api]
          - shard: int:neon
            dbs: [neon]
          - shard: int:sqlite
            dbs: []
          - shard: int:turso-serverless
            dbs: [turso]
          - shard: int:other
            dbs: [mysql, postgres, postgres-postgis, postgres-vector]
          - shard: int:seeder
            dbs: [mysql, postgres]
          - shard: int:imports
            dbs: []
          - shard: int:planetscale
            dbs: []
            cloud: [planetscale]
          - shard: int:cockroach
            dbs: [cockroach]
          - shard: int:cockroach-rqb
            dbs: [cockroach]
          - shard: int:bun
            dbs: [postgres, postgres-vector, postgres-postgis, mysql]
          - shard: int:mssql
            dbs: [mssql]
          - shard: orm
            dbs: []
          - shard: kit:other
            dbs: [mysql]
          - shard: kit:postgres
            dbs: [postgres, postgres-postgis]
          - shard: kit:postgres18
            dbs: [postgres, postgres-postgis, postgres18]
          - shard: kit:postgres17
            dbs: [postgres, postgres-postgis, postgres17]
          - shard: kit:postgres16
            dbs: [postgres, postgres-postgis, postgres16]
          - shard: kit:postgres:commutativity
            dbs: [postgres18]
          - shard: kit:cockroach
            dbs: [cockroach]
          - shard: kit:mssql
            dbs: [mssql]
          - shard: seed
            dbs: [cockroach, mysql, mssql, postgres-postgis]
          - shard: validators
            dbs: []
         
    name: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        # Self-hosted: keep node_modules between jobs; setup-pnpm removes everything else untracked.
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/runner-slot
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --prefer-offline

      # Fork PRs get no secrets and skip the hosted databases.
      - name: Create this job's hosted databases
        id: hosted-databases
        if: ${{ matrix.cloud && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        working-directory: integration-tests
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          NETLIFY_DB_URL: ${{ secrets.NETLIFY_DB_URL }}
          PLANETSCALE_CONNECTION_STRING: ${{ secrets.PLANETSCALE_CONNECTION_STRING }}
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          TURSODATABASE_REMOTE_URL: ${{ secrets.TURSODATABASE_REMOTE_URL }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_GROUP: ${{ secrets.TURSO_GROUP }}
        run: pnpm exec tsx scripts/ci-databases.ts create --job "${{ matrix.shard }}" ${{ join(matrix.cloud, ' ') }}

      # One compose project per dialect: postgres16/17/18.yml all name their service `postgres`, so merging them
      # into one project left a single container.
      - name: Start DBs needed by shard (pre-warm)
        if: ${{ matrix.dbs && join(matrix.dbs, ',') != '' }}
        run: bash compose/dockers.sh up ${{ join(matrix.dbs, ' ') }}

      - name: Fetch build-dist (compiled JS)
        uses: ./.github/actions/fetch-build

      # Required for packaging tests
      - name: Wait for prepare's packages
        if: matrix.shard == 'orm'
        uses: ./.github/actions/wait-for-prepare
        with: { names: packages }
      - name: Download packed tarballs
        if: matrix.shard == 'orm'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: .

      # No `pnpm build` here — we reuse dist to save time

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Run tests
        env:
          # Fork pull requests get no secrets: skip the shards that need hosted databases.
          SKIP_EXTERNAL_DB_TESTS: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '1' || '' }}
          PLANETSCALE_CONNECTION_STRING: ${{ secrets.PLANETSCALE_CONNECTION_STRING }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
          XATA_API_KEY: ${{ secrets.XATA_API_KEY }}
          XATA_BRANCH: ${{ secrets.XATA_BRANCH }}
          LIBSQL_REMOTE_URL: ${{ secrets.LIBSQL_REMOTE_URL }}
          LIBSQL_REMOTE_TOKEN: ${{ secrets.LIBSQL_REMOTE_TOKEN }}
          TURSODATABASE_REMOTE_URL: ${{ secrets.TURSODATABASE_REMOTE_URL }}
          TURSODATABASE_REMOTE_TOKEN: ${{ secrets.TURSODATABASE_REMOTE_TOKEN }}
          NETLIFY_DB_URL: ${{ secrets.NETLIFY_DB_URL }}
        run: bash .github/ci/run-shard.sh "${{ matrix.shard }}"

      - name: Drop this job's hosted databases
        if: ${{ always() && steps.hosted-databases.outcome != 'skipped' }}
        working-directory: integration-tests
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          NETLIFY_DB_URL: ${{ secrets.NETLIFY_DB_URL }}
          PLANETSCALE_CONNECTION_STRING: ${{ secrets.PLANETSCALE_CONNECTION_STRING }}
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          TURSODATABASE_REMOTE_URL: ${{ secrets.TURSODATABASE_REMOTE_URL }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: pnpm exec tsx scripts/ci-databases.ts drop

      # GitHub-hosted runners discard the VM; a self-hosted one keeps containers running between jobs.
      - name: Stop this job's databases
        if: ${{ always() && runner.environment == 'self-hosted' && matrix.dbs && join(matrix.dbs, ',') != '' }}
        run: bash compose/dockers.sh down ${{ join(matrix.dbs, ' ') }}

  attw:
    needs: [prepare-head-start]
    permissions: { contents: read, actions: read }
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        # Self-hosted: keep node_modules between jobs; setup-pnpm removes everything else untracked.
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Wait for prepare's packages
        uses: ./.github/actions/wait-for-prepare
        with: { names: packages }
      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts
      - name: Run @arethetypeswrong/cli
        run: |
          bun --bun run ./attw-fork/src/run.ts ./artifacts/drizzle-seed/package.tgz
          bun --bun run ./attw-fork/src/run.ts ./artifacts/eslint-plugin-drizzle/package.tgz
        env:
          ATTW_FORMAT: concise

  attw-esm:
    needs: [prepare-head-start]
    permissions: { contents: read, actions: read }
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    strategy:
      matrix:
        package: [drizzle-orm, drizzle-kit]
        mode: [node16-esm, bundler]
    steps:
      - uses: actions/checkout@v7
        # Self-hosted: keep node_modules between jobs; setup-pnpm removes everything else untracked.
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: ./.github/actions/pnpm-store
      - run: pnpm fetch && pnpm install --frozen-lockfile --prefer-offline
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Wait for prepare's packages
        uses: ./.github/actions/wait-for-prepare
        with: { names: packages }
      - name: Download package tarballs
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts
      - name: Run @arethetypeswrong/cli
        working-directory: ${{ matrix.package }}
        run: bun --bun run ../attw-fork/src/run.ts ../artifacts/${{ matrix.package }}/package.tgz ${{ matrix.mode }}
        env:
          ATTW_FORMAT: concise

  publint-orm:
    needs: [prepare]
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Download drizzle-orm tarball
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts
      - name: Run publint
        run: npx -y publint@0.3.21 ./artifacts/drizzle-orm/package.tgz

  packed-orm:
    needs: [prepare-head-start]
    permissions: { contents: read, actions: read }
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    strategy:
      matrix:
        # The consumer projects run on each of these versions. 20.19.0 and 22.12.0 are the oldest versions in the
        # engines range, where require() of ESM works without a flag. vitest needs a newer Node, so it runs on Node 24.
        node-version: ['20.19.0', '22.12.0', 'lts/*', 'latest']
    steps:
      - uses: actions/checkout@v7
        # Self-hosted: keep node_modules between jobs; setup-pnpm removes everything else untracked.
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: ./.github/actions/runner-slot
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node-version }}' }
      - run: echo "CONSUMER_NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Start Postgres
        run: bash compose/dockers.sh up postgres
      - name: Fetch build-dist (compiled JS)
        uses: ./.github/actions/fetch-build
      - name: Run packed package test
        working-directory: integration-tests
        run: |
          source ../compose/ports.sh
          PG_CONNECTION_STRING="postgres://postgres:postgres@localhost:${DRIZZLE_PORT_POSTGRES}/drizzle" pnpm --stream test:packed
      - name: Stop Postgres
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: bash compose/dockers.sh down postgres

  skills-revision-gate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Skip on non-pull-request events
        if: github.event_name != 'pull_request'
        run: echo "Not a pull request — skills revision gate does not apply"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with: { fetch-depth: 0, clean: "${{ runner.environment != 'self-hosted' }}" }
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-pnpm
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with: { node-version: '24' }
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/pnpm-store
      - name: Skills revision gate
        if: github.event_name == 'pull_request'
        working-directory: drizzle-kit
        env:
          GH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm skills:revision:check

  release:
    needs: [test, prepare, attw, attw-esm, publint-orm, packed-orm, skills-revision-gate]
    # workflow_dispatch only: this job holds `id-token: write` and is the sole path to
    # the publish step, so PR/push events must never enter it — that would both expose
    # OIDC minting to untrusted PR code and auto-publish on push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Always GitHub-hosted: npm provenance (OIDC) is only issued there.
    permissions: { contents: read, id-token: write }
    
    # force empty so npm can use OIDC
    env:
      NODE_AUTH_TOKEN: ""   
      NPM_TOKEN: ""
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.publish_matrix) }}
    steps:
      - uses: actions/checkout@v7

      # don't specify registry url, so there's no .npmrc config file
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      
      # nuke, so npm can use OIDC
      - name: Remove temp npmrc
        run: rm -f "$NPM_CONFIG_USERCONFIG"
    
      # >= 11.5.1 for trusted publishing
      - name: Update NPM
        run: npm install -g npm@11 # npm 12.0.0 ships without sigstore in its bundled tree and breaks `npm publish`
      - name: Configure GitHub Packages auth
        if: inputs.publish_to_github
        env:
          # a PAT instead of GITHUB_TOKEN: workflow-token publishes link the package to this
          # public repo and inherit its visibility; PAT publishes default to private
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [[ -z "$GH_PACKAGES_TOKEN" ]]; then
            echo "::error::Set the GH_PACKAGES_TOKEN secret (classic PAT with write:packages) to publish to GitHub Packages"
            exit 1
          fi
          echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts
      - name: Check preconditions (from tarball)
        id: checks
        shell: bash
        run: |
          set -euxo pipefail

          if [[ "${{ inputs.publish_to_github }}" == "true" ]]; then
            # GitHub Packages only accepts packages scoped to the repo owner; the repository
            # field is stripped so the package isn't linked to this public repo and stays private
            pkg_name="@${{ github.repository_owner }}/${{ matrix.package }}"
            strip_repo="true"
            registry_args=(--registry=https://npm.pkg.github.com)
          else
            pkg_name="${{ matrix.package }}"
            strip_repo="false"
            registry_args=()
          fi

          _version="$(tar -xOf ./artifacts/${{ matrix.package }}/package.tgz package/package.json | jq -r .version)"
          branch="${{ github.ref_name }}"
          if [[ "$branch" == "beta" ]]; then
            tag="rc"
            version="$_version"
          else
            tag="$branch"
            suffix=$(git rev-parse --short HEAD)
            version="$_version-$suffix"
          fi
          tmpdir="$(mktemp -d)"
          tar -xzf ./artifacts/${{ matrix.package }}/package.tgz -C "$tmpdir"

          jq --arg v "$version" --arg n "$pkg_name" --argjson strip_repo "$strip_repo" \
            '.version = $v | .name = $n | if $strip_repo then del(.repository) else . end' \
            "$tmpdir/package/package.json" > "$tmpdir/package/package.json.tmp"
            mv "$tmpdir/package/package.json.tmp" "$tmpdir/package/package.json"

          tar -czf ./artifacts/${{ matrix.package }}/package.tgz -C "$tmpdir" package
          rm -rf "$tmpdir"

          # tolerate 404 (never published) and a single-version string response
          is_published="$(npm view "$pkg_name" versions --json "${registry_args[@]}" 2>/dev/null | jq -r --arg v "$version" '[.] | flatten | any(. == $v)' || echo false)"
          if [[ "$is_published" == "true" ]]; then
            echo "\`$pkg_name@$version\` already published, tagging \`$tag\`" >> $GITHUB_STEP_SUMMARY
          else
            { echo "version=$version"; echo "tag=$tag"; echo "has_new_release=true"; } >> $GITHUB_OUTPUT
          fi
      - name: Publish (from tarball)
        if: steps.checks.outputs.has_new_release == 'true'
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euxo pipefail
          if [[ "${{ inputs.publish_to_github }}" == "true" ]]; then
            # provenance is npmjs-only
            npm publish ./artifacts/${{ matrix.package }}/package.tgz --tag "${{ steps.checks.outputs.tag }}" --registry=https://npm.pkg.github.com --no-provenance
            pkg_url=""
            SECONDS=0
            until [[ -n "$pkg_url" ]] || (( SECONDS >= 10 )); do
              pkg_url="$(curl -fsSL -H "Authorization: Bearer $GH_PACKAGES_TOKEN" \
                "https://api.github.com/orgs/${{ github.repository_owner }}/packages/npm/${{ matrix.package }}/versions?per_page=100" \
                | jq -r --arg v "${{ steps.checks.outputs.version }}" 'first(.[] | select(.name == $v) | .html_url) // empty' || true)"
              [[ -n "$pkg_url" ]] || sleep 2
            done
            pkg_url="${pkg_url:-https://github.com/orgs/${{ github.repository_owner }}/packages/npm/package/${{ matrix.package }}}"
            echo "GitHub Packages: [\`@${{ github.repository_owner }}/${{ matrix.package }}@${{ steps.checks.outputs.tag }} | ${{ steps.checks.outputs.version }}\`]($pkg_url)" >> $GITHUB_STEP_SUMMARY
          else
            npm publish ./artifacts/${{ matrix.package }}/package.tgz --tag "${{ steps.checks.outputs.tag }}"
            echo "npm: \`${{ matrix.package }}@${{ steps.checks.outputs.tag }} | ${{ steps.checks.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          fi
