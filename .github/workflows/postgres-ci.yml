# postgres-publish.yml calls this workflow as its release gate.
name: postgres CI

on:
  pull_request:
    paths:
      - 'postgres/**'
      - '.github/workflows/postgres-ci.yml'
  push:
    branches: [main, beta]
    paths:
      - 'postgres/**'
      - '.github/workflows/postgres-ci.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: postgres

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      - run: bun run typecheck
      - run: bun run build
      - run: bun test test/unit
      - run: bun run verify:publish

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Put PostgreSQL server binaries on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/postgres" --version
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      - run: bash test/setup-pg.sh
      - run: bun test test/integration --timeout 20000
        env:
          DRIZZLE_POSTGRES_TEST_TIMEOUT_MS: 20000
      - if: failure()
        run: cat test/.pgdata/server.log

  # The peer range is `^4.0.6`, and Effect's SQL modules change in patch releases.
  effect-versions:
    name: effect (${{ matrix.effect }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        effect: ['4.0.6', '^4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Put PostgreSQL server binaries on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/postgres" --version
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      # A range would keep the locked version, so install the newest exact match.
      - run: pnpm add --save-dev "effect@$(npm view 'effect@${{ matrix.effect }}' version --json | jq -r 'if type == "array" then .[-1] else . end')"
      - run: pnpm list effect
      - run: bun run typecheck
      - run: bash test/setup-pg.sh
      - run: bun test test/integration/effect-*.test.ts --timeout 20000
        env:
          DRIZZLE_POSTGRES_TEST_TIMEOUT_MS: 20000
      - if: failure()
        run: cat test/.pgdata/server.log

  deno:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Put PostgreSQL server binaries on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/postgres" --version
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      - run: bash test/setup-pg.sh
      - run: deno test --no-check --allow-net --allow-env --allow-read --allow-sys test/deno/deno.test.ts test/deno/effect.test.ts
      - if: failure()
        run: cat test/.pgdata/server.log

  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Put PostgreSQL server binaries on PATH
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "$PGBIN" >> "$GITHUB_PATH"
          "$PGBIN/postgres" --version
      - run: pnpm install --frozen-lockfile --filter @drizzle-team/postgres
      - run: bash test/setup-pg.sh
      - run: bun run test:cf
      - if: failure()
        run: cat test/.pgdata/server.log
