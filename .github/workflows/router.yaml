name: Release Router

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_github:
        description: 'Publish to GitHub Packages instead of npm'
        type: boolean
        default: false
      packages:
        description: 'Comma-separated list of packages to publish, or "all"'
        type: string
        default: 'all'

# A new push to a PR cancels the run of the previous head before any job starts. The cancel in the
# called workflows needs a free runner first, and on a busy organization that can take hours.
# Manual runs get a group of their own, so a release is never canceled.
concurrency:
  group: router-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  switch:
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.route.outputs.target }}
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      # The pipeline runs on the self-hosted machine when one of its runners is online, on GitHub-hosted runners
      # otherwise. Fork pull requests always run GitHub-hosted: a self-hosted runner would execute their code.
      # Listing runners needs a token with read access to the organization's self-hosted runners
      # (secrets.CI_RUNNERS_TOKEN); without it everything runs GitHub-hosted.
      - name: Pick runner
        id: runner
        shell: bash
        env:
          TOKEN: ${{ secrets.CI_RUNNERS_TOKEN }}
          LABEL: ${{ vars.SELF_HOSTED_RUNNER_LABEL || 'beelink' }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          hosted='"ubuntu-24.04"'
          pick() { echo "runner=$1" >> "$GITHUB_OUTPUT"; echo "Runner: $1 ($2)"; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            pick "$hosted" 'fork pull request'; exit 0
          fi
          if [[ -z "$TOKEN" ]]; then pick "$hosted" 'no CI_RUNNERS_TOKEN'; exit 0; fi
          online=0
          for path in "orgs/${GITHUB_REPOSITORY_OWNER}/actions/runners" "repos/${GITHUB_REPOSITORY}/actions/runners"; do
            n=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' "${GITHUB_API_URL}/${path}?per_page=100" \
              | jq --arg label "$LABEL" '[.runners[] | select(.status == "online" and any(.labels[]; .name == $label))] | length' 2>/dev/null || echo 0)
            online=$((online + ${n:-0}))
          done
          if (( online > 0 )); then
            pick "$(jq -cn --arg label "$LABEL" '["self-hosted", $label]')" "$online '$LABEL' runner(s) online"
          else
            pick "$hosted" "no '$LABEL' runner online"
          fi
      - name: Route release
        id: route
        shell: bash
        run: |
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${GITHUB_REF##*/}" == "main" ]]; then
            if [[ "${{ inputs.publish_to_github }}" == "true" ]]; then
              echo "::error::Publishing to GitHub Packages is only supported for feature-branch dispatches, not main"
              exit 1
            fi
            if [[ -n "${{ inputs.packages }}" && "${{ inputs.packages }}" != "all" ]]; then
              echo "::error::Package filtering is only supported for feature-branch dispatches, not main"
              exit 1
            fi
            echo "target=latest" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch on a non-main ref and any pull request (same-repo or
            # fork) run the feature pipeline. Fork PRs run via the standard pull-request
            # event so they get no repo secrets; the publish step is separately gated to
            # workflow_dispatch only.
            echo "target=feature" >> $GITHUB_OUTPUT
          fi

  run-feature:
    needs: switch
    # In a PR stack, only the top PR runs CI: it contains the commits of every PR below it, and
    # merging it merges the whole stack. When the top PR closes, the PR below gets no event. A
    # re-run uses the old payload and skips again, so close and reopen that PR to start CI.
    if: >-
      needs.switch.outputs.target == 'feature' && (
        github.event.pull_request.stack == null ||
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    uses: ./.github/workflows/release-feature-branch.yaml
    with:
      publish_to_github: ${{ inputs.publish_to_github == true }}
      packages: ${{ inputs.packages || 'all' }}
      runner: ${{ needs.switch.outputs.runner || '"ubuntu-24.04"' }}
    secrets:
      PLANETSCALE_CONNECTION_STRING: ${{ secrets.PLANETSCALE_CONNECTION_STRING }}
      NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      NEON_HTTP_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
      XATA_API_KEY: ${{ secrets.XATA_API_KEY }}
      XATA_BRANCH: ${{ secrets.XATA_BRANCH }}
      LIBSQL_REMOTE_URL: ${{ secrets.LIBSQL_REMOTE_URL }}
      LIBSQL_REMOTE_TOKEN: ${{ secrets.LIBSQL_REMOTE_TOKEN }}
      TURSODATABASE_REMOTE_URL: ${{ secrets.TURSODATABASE_REMOTE_URL }}
      TURSODATABASE_REMOTE_TOKEN: ${{ secrets.TURSODATABASE_REMOTE_TOKEN }}
      SQLITE_CLOUD_CONNECTION_STRING: ${{ secrets.SQLITE_CLOUD_CONNECTION_STRING }}
      SQLITE_MANY_CLOUD_CONNECTION_STRING: ${{ secrets.SQLITE_MANY_CLOUD_CONNECTION_STRING }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      NETLIFY_DB_URL: ${{ secrets.NETLIFY_DB_URL }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      TURSO_ORG: ${{ secrets.TURSO_ORG }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_GROUP: ${{ secrets.TURSO_GROUP }}

  run-latest:
    needs: switch
    if: needs.switch.outputs.target == 'latest'
    uses: ./.github/workflows/release-latest.yaml
    secrets:
      PLANETSCALE_CONNECTION_STRING: ${{ secrets.PLANETSCALE_CONNECTION_STRING }}
      NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      NEON_HTTP_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      TIDB_CONNECTION_STRING: ${{ secrets.TIDB_CONNECTION_STRING }}
      XATA_API_KEY: ${{ secrets.XATA_API_KEY }}
      XATA_BRANCH: ${{ secrets.XATA_BRANCH }}
      LIBSQL_REMOTE_URL: ${{ secrets.LIBSQL_REMOTE_URL }}
      LIBSQL_REMOTE_TOKEN: ${{ secrets.LIBSQL_REMOTE_TOKEN }}
      TURSODATABASE_REMOTE_URL: ${{ secrets.TURSODATABASE_REMOTE_URL }}
      TURSODATABASE_REMOTE_TOKEN: ${{ secrets.TURSODATABASE_REMOTE_TOKEN }}
      SQLITE_CLOUD_CONNECTION_STRING: ${{ secrets.SQLITE_CLOUD_CONNECTION_STRING }}
      SQLITE_MANY_CLOUD_CONNECTION_STRING: ${{ secrets.SQLITE_MANY_CLOUD_CONNECTION_STRING }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      TURSO_ORG: ${{ secrets.TURSO_ORG }}
      TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
      TURSO_GROUP: ${{ secrets.TURSO_GROUP }}
