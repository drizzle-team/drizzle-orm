# drizzle-pulse-publish.yml calls this workflow as its release gate.
name: drizzle-pulse CI

on:
  pull_request:
    paths:
      - 'drizzle-pulse/**'
      - 'postgres/**'
      - 'compose/pulse.*'
      - 'drizzle-orm/src/**'
      - 'drizzle-orm/package.json'
      - 'drizzle-orm/scripts/**'
      - 'drizzle-orm/tsconfig.json'
      - 'tsconfig.json'
      - '.github/workflows/drizzle-pulse-ci.yml'
  push:
    branches: [main, beta]
    paths:
      - 'drizzle-pulse/**'
      - 'postgres/**'
      - 'compose/pulse.*'
      - 'drizzle-orm/src/**'
      - 'drizzle-orm/package.json'
      - 'drizzle-orm/scripts/**'
      - 'drizzle-orm/tsconfig.json'
      - 'tsconfig.json'
      - '.github/workflows/drizzle-pulse-ci.yml'
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: drizzle-pulse

# In a PR stack, only the top PR runs these jobs, as with `run-feature` in router.yaml.
jobs:
  unit:
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter 'drizzle-pulse...' --filter 'drizzle-orm...'
        working-directory: .
      # Drizzle Pulse imports drizzle-orm from drizzle-orm/dist.
      - run: pnpm build:orm
        working-directory: .
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:types
      - run: pnpm verify:publish

  integration:
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter 'drizzle-pulse...' --filter 'drizzle-orm...'
        working-directory: .
      - run: pnpm build:orm
        working-directory: .
      - run: pnpm build
      # PostgreSQL 16 with PostGIS, pgvector and logical WAL. No service container has all three.
      - run: bash compose/dockers.sh up pulse
        working-directory: .
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
      - if: failure()
        run: bash compose/dockers.sh logs-dump pulse
        working-directory: .
      - if: always()
        run: bash compose/dockers.sh down pulse
        working-directory: .
