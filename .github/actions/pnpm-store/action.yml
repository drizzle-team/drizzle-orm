name: pnpm store cache
description: >-
  Restores the pnpm store, including pnpm's side-effects cache, so native modules (sqlite3, better-sqlite3,
  cpu-features, ...) are not built again. A cache is scoped to the branch that saves it: a pull request reads
  its own caches and its base branch's. Pull requests save a store only when neither exists — a ~740 MB store
  saved by every pull request kept the repository at its 10 GB cache limit, which evicted the base-branch
  caches all of them should share. Base branches save it in cache-seed.yaml (save: 'true').
  Needs pnpm on PATH (pnpm/action-setup) and a checkout.

inputs:
  save:
    description: Always save the store when the exact key missed. Only cache-seed.yaml sets it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # A self-hosted machine keeps one pnpm store for all its runner instances and jobs, so it is warm after the
    # first install and native builds come from its side-effects cache; restoring a 740 MB archive into it from
    # several jobs at once would only race. The store is named here rather than left at pnpm's default,
    # $PNPM_HOME/store, because setup-pnpm gives every pnpm version its own PNPM_HOME, and an update of pnpm
    # should not start from an empty store. pnpm writes the store content-addressed and atomically, so
    # concurrent installs can share it.
    - if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        store="$HOME/.cache/drizzle-ci/pnpm-store"
        echo "pnpm_config_store_dir=$store" >> "$GITHUB_ENV"
        # Hardlinks rather than a copy or clone per file: a link is one metadata entry, and node_modules is ~1,800
        # packages linked by many jobs at once. Needs the store (~/.cache/drizzle-ci) and the runners' work folders on
        # one filesystem; in runner containers, mount one volume for both. Nothing edits files inside
        # node_modules, which a hardlink would write through to the store.
        echo "pnpm_config_package_import_method=hardlink" >> "$GITHUB_ENV"
        echo "pnpm store: $store (hardlinks)"

    # GitHub-hosted runners start empty.
    - id: store
      if: runner.environment != 'self-hosted'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # Checks which cache exists without downloading it. A changed lockfile misses the exact key and matches the
    # newest store under the prefix, so pnpm install only fetches and builds the difference.
    - id: lookup
      if: runner.environment != 'self-hosted'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
        lookup-only: true

    # A store exists for this branch or its base: restore it, never save.
    - if: runner.environment != 'self-hosted' && inputs.save != 'true' && steps.lookup.outputs.cache-matched-key != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    # Base branches (cache-seed.yaml), and pull requests with no store at all, so their next run is not cold:
    # restores what there is and saves the store after the job when the exact key missed.
    - if: runner.environment != 'self-hosted' && (inputs.save == 'true' || steps.lookup.outputs.cache-matched-key == '')
      uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
