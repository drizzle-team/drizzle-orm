name: Runner slot
description: >-
  On a self-hosted runner, gives this runner instance its own database ports and compose projects
  (CI_PORT_OFFSET, read by compose/ports.sh), so jobs that run side by side on one machine never share a
  database. The slot is the last digit of the number the instance's name ends with (beelink-3 -> 3, beelink-10 -> 0;
  ports shifted by 100 per slot), so instances numbered 0-9 or 1-10 all differ; names without a number fail
  rather than silently share. Does nothing on GitHub-hosted runners, which give every job its own VM.

runs:
  using: composite
  steps:
    - if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! "$RUNNER_NAME" =~ ([0-9]+)$ ]]; then
          echo "::error::Self-hosted runner '$RUNNER_NAME' has no number at the end of its name; name the instances <name>-0 .. <name>-9 so their databases get separate ports"
          exit 1
        fi
        slot=$((10#${BASH_REMATCH[1]} % 10))
        echo "CI_PORT_OFFSET=$((slot * 100))" >> "$GITHUB_ENV"
        echo "Runner $RUNNER_NAME: slot $slot, database ports shifted by $((slot * 100))"
