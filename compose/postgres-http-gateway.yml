services:
  postgres-http-gateway:
    image: ghcr.io/drizzle-team/postgres-http-gateway:latest
    platform: linux/amd64 # no arm64 build: ARM hosts (Apple silicon, OrbStack runners) run it emulated
    mem_limit: 256m

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGHOST: host.docker.internal
      PGPORT: ${DRIZZLE_PORT_POSTGRES:-55433}
      PGSSLMODE: disable
      HTTPPG_LOG_LEVEL: info
    ports:
      - "${DRIZZLE_PORT_HTTP_GATEWAY:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
