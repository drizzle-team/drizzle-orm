services:
  postgres-http-gateway:
    image: ghcr.io/drizzle-team/postgres-http-gateway:latest

    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGHOST: host.docker.internal
      PGPORT: 55433
      PGSSLMODE: disable
      HTTPPG_LOG_LEVEL: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
