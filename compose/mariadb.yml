services:
  mariadb:
    image: mariadb:11.8
    network_mode: bridge
    # Test data only: no forced disk writes or binary log.
    command: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --innodb-doublewrite=OFF
    mem_limit: 2g
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      MARIADB_DATABASE: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_MARIADB:-33306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
