services:
  mariadb:
    image: mariadb:11.8
    network_mode: bridge
    mem_limit: 2g
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      MARIADB_DATABASE: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_MARIADB:-33306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s
