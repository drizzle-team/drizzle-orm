services:
  postgres:
    image: pgvector/pgvector:pg16
    network_mode: bridge
    # Test data only: no forced disk writes, which on a busy CI machine make every commit and CREATE DATABASE wait.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_POSTGRES16:-54323}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drizzle"]
      interval: 2s
      timeout: 3s
      retries: 30
