services:
  mssql:
    # SQL Server 2025: the earliest with all JSON functions sql.jsonObject / sql.jsonArray build on (json_arrayagg)
    image: mcr.microsoft.com/mssql/server:2025-latest
    network_mode: bridge
    mem_limit: 10g
    # A self-hosted machine's shared server runs for days.
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '2'
    # Data in memory: throwaway test data that need not reach the disk, which on a runner machine is written to
    # all day. Memory counts against mem_limit; the size is a ceiling, used only as data is written. SQL Server opens
    # its files with O_DIRECT, which tmpfs supports since Linux 6.6.
    tmpfs:
      # Owned by the image's non-root `mssql` user (10001)
      - /var/opt/mssql:size=8g,uid=10001,gid=0,mode=0770
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "drizzle123PASSWORD!"
      # SQL Server otherwise grows its buffer pool towards most of the host RAM; mem_limit leaves it headroom. 4 GB: on a
      # self-hosted machine every job's databases share this server.
      MSSQL_MEMORY_LIMIT_MB: "4096"
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_MSSQL:-1433}:1433"
    healthcheck:
      test: ["CMD", "bash", "-lc", "/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U SA -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1'"]
      interval: 2s
      timeout: 3s
      retries: 60
