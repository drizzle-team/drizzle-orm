services:
  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:0.2.67
    platform: linux/amd64 # no arm64 build: ARM hosts (Apple silicon, OrbStack runners) run it emulated
    network_mode: bridge
    environment:
      ROOT_PASSWORD: singlestore
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_SINGLESTORE:-33307}:3306"
    healthcheck:
      test: ["CMD", "bash", "-lc", "nc -z 127.0.0.1 3306"]
      interval: 2s
      timeout: 3s
      retries: 60
