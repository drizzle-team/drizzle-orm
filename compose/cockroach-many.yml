services:
  cockroach0:
    image: cockroachdb/cockroach:v25.2.0
    mem_limit: 3g
    command: start-single-node --insecure --store=type=mem,size=2GiB
    ports:
      - "${DRIZZLE_PORT_COCKROACH_MANY0:-26260}:26257"
      - "${DRIZZLE_PORT_COCKROACH_MANY0_CONSOLE:-18081}:8080" # web console
    healthcheck:
      test: ["CMD", "bash", "-lc", "nc -z 127.0.0.1 26257"]
      interval: 2s
      timeout: 3s
      retries: 60

  cockroach1:
    image: cockroachdb/cockroach:v25.2.0
