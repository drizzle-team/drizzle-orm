services:
  postgres:
    image: postgres:17-alpine # change to 18-alpine when ready
    network_mode: bridge
    # Test data only: no forced disk writes, which on a busy CI machine make every commit and CREATE DATABASE wait.
    # max_connections and memory for a self-hosted machine, where every runner instance's job shares this server.
    #
    # The Drizzle Postgres driver's suite (postgres/) runs on this server too, in databases of its own. For it:
    # the entrypoint installs a self-signed certificate (CN=localhost) and the authentication file, TLS is on (a client
    # that doesn't ask for it connects as before), the WAL is logical (replication.test.ts), and JIT is off (the
    # first compile of a large query loads LLVM, seconds of waiting for a test's first row).
    entrypoint: ["bash", "/drizzle/entrypoint.sh"]
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
      -c ssl=on -c ssl_cert_file=/etc/drizzle/server.crt -c ssl_key_file=/etc/drizzle/server.key
      -c hba_file=/etc/drizzle/pg_hba.conf -c wal_level=logical -c jit=off
    volumes:
      - ./postgres:/drizzle:ro
      # the certificate and key compose/dockers.sh makes before the start
      - ../postgres/test/.pgdata:/drizzle-tls:ro
    mem_limit: 10g
    # Data in memory: throwaway test data that need not reach the disk, which on a runner machine is written to
    # all day. Memory counts against mem_limit; the size is a ceiling, used only as data is written (the write-ahead
    # log alone may reach 1 GB).
    tmpfs:
      - /var/lib/postgresql/data:size=8g
      - /etc/drizzle:size=1m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_POSTGRES:-55433}:5432"
      # the same server on the port the driver's suite and its docs use
      - "${DRIZZLE_PORT_POSTGRES_DRIVER:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drizzle"]
      interval: 2s
      timeout: 3s
      retries: 30
