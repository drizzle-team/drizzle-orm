# The image's own rules (trust on the socket, SCRAM from any address), plus one for the driver suite's md5user, which
# authenticates with MD5 (postgres/test/integration/auth.test.ts). Connections arrive from Docker's gateway address,
# never 127.0.0.1, so the rules match any address. Logical replication connections name a database, so `all` covers
# the driver's replication.test.ts.
local   all all               trust
host    all md5user 0.0.0.0/0 md5
host    all md5user ::0/0     md5
host    all all     0.0.0.0/0 scram-sha-256
host    all all     ::0/0     scram-sha-256
