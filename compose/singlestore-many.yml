services:
  singlestore0:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:0.2.67
    environment:
      ROOT_PASSWORD: singlestore
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_SINGLESTORE_MANY0:-3308}:3306"
    healthcheck:
      test: ["CMD", "bash", "-lc", "nc -z 127.0.0.1 3306"]
      interval: 2s
      timeout: 3s
      retries: 60

