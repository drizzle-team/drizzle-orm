services: 
  postgres-vector:
    image: pgvector/pgvector:pg16
    network_mode: bridge
    # Test data only: no forced disk writes, which on a busy CI machine make every commit and CREATE DATABASE wait.
    # max_connections and memory for a self-hosted machine, where every runner instance's job shares this server.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=1000
    mem_limit: 3g
    # Data in memory: throwaway test data that need not reach the disk, which on a runner machine is written to
    # all day. Memory counts against mem_limit.
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_VECTOR:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drizzle"]
      interval: 2s
      timeout: 3s
      retries: 30