services:
  mysql:
    image: mysql:8
    network_mode: bridge
    # Test data only: no forced disk writes or binary log.
    command: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --skip-log-bin --innodb-doublewrite=OFF --innodb-redo-log-capacity=16M
    mem_limit: 3g
    # Data in memory: throwaway test data that need not reach the disk, which on a runner machine is written to
    # all day. Memory counts against mem_limit.
    tmpfs:
      - /var/lib/mysql:size=1g
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_MYSQL:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 2s
      timeout: 3s
      retries: 40

