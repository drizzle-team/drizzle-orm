services:
  mysql:
    image: mysql:8
    network_mode: bridge
    # Test data only: no forced disk writes or binary log.
    command: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0 --skip-log-bin --innodb-doublewrite=OFF
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: drizzle
      TZ: UTC
    ports:
      - "${DRIZZLE_PORT_MYSQL:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 2s
      timeout: 3s
      retries: 40

