services:
  cockroach:
    image: cockroachdb/cockroach:v25.2.0
    command: start-single-node --insecure --store=type=mem,size=2GiB
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 60
